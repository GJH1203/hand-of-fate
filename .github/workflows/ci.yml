name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first one's results irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # The test suite is entirely @SpringBootTest and needs a live MongoDB. Each test
      # class talks to a database of its own inside this one server, so they no longer
      # delete each other's data.
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/card_game

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # The rules of the game, checked without a browser or a database. Fast enough
      # that there is no excuse for a change to land without running them.
      - name: Test
        run: npm test

      # No Supabase credentials here on purpose. lib/supabase.ts falls back to a null
      # client when they are absent, so the build proves the code compiles without
      # putting real project keys in CI.
      - name: Build
        run: npm run build
