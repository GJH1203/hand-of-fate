AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Hand of Fate — ECS on EC2, single t4g.small (arm64/Graviton).
  Runs backend + Nakama + Postgres + cloudflared as one task. MongoDB is
  external (Atlas). Ingress is via Cloudflare Tunnel, so the security group
  opens no inbound ports at all and the instance is never addressed directly.

Parameters:
  ProjectName:
    Type: String
    Default: hand-of-fate

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC works fine; the instance needs a public subnet.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Must be a public subnet with auto-assign public IP. The instance needs
      outbound internet for ECR, Atlas, and the Cloudflare tunnel. A private
      subnet would require a NAT gateway at ~$32/month, which is more than the
      rest of this stack combined.

  InstanceType:
    Type: String
    Default: t4g.small
    Description: Graviton. Every container image must be linux/arm64.

  BackendImage:
    Type: String
    Description: Full ECR image URI for the backend, including tag.

  NakamaImage:
    Type: String
    Default: registry.heroiclabs.com/heroiclabs/nakama:3.26.0
    Description: >
      3.26.0 is the earliest tag published for arm64. Older tags are amd64-only
      and will not run here.

  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/arm64/recommended/image_id
    Description: Resolved at deploy time so the AMI stays current.

  MongoUriParameter:
    Type: String
    Default: /hand-of-fate/mongodb-uri
    Description: SSM SecureString holding the Atlas connection string.

  TunnelTokenParameter:
    Type: String
    Default: /hand-of-fate/cloudflared-token
    Description: SSM SecureString holding the Cloudflare Tunnel token.

  PostgresPasswordParameter:
    Type: String
    Default: /hand-of-fate/postgres-password
    Description: SSM SecureString holding the Nakama Postgres password.

  NakamaServerKeyParameter:
    Type: String
    Default: /hand-of-fate/nakama-server-key
    Description: SSM SecureString holding the Nakama server key.

  SupabaseJwksUri:
    Type: String
    Description: >
      Where Supabase publishes the public half of its JWT signing key. The backend
      verifies every request against it and refuses to start without it. Public
      information, so it is a parameter rather than an SSM secret.
    AllowedPattern: ^https://.+/auth/v1/\.well-known/jwks\.json$

  SupabaseJwtIssuer:
    Type: String
    Description: >
      Expected iss claim, https://<project-ref>.supabase.co/auth/v1. Rejects a
      correctly signed token issued by somebody else's Supabase project.
    AllowedPattern: ^https://.+/auth/v1$

  AdminSupabaseUserIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Supabase user ids allowed to reach /admin/**. Empty means nobody is, and the
      admin endpoints answer 403 to every caller.

  DataVolumeAvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: >
      Must be the availability zone SubnetId lives in — an EBS volume can only attach
      to an instance in its own zone.

  DataVolumeSizeGb:
    Type: Number
    Default: 8
    MinValue: 4
    Description: >
      Nakama's Postgres. It holds accounts and leaderboards for a game aiming at a
      hundred concurrent players, so this is sized for headroom rather than need.

  BackupImage:
    Type: String
    Default: ""
    Description: >
      Full ECR image URI for the backup job, built from infra/backup. Leave empty to
      deploy without scheduled backups.

  BackupSchedule:
    Type: String
    Default: cron(0 9 * * ? *)
    Description: >
      When to run the backup, in UTC. The default is 09:00 UTC, which is the small
      hours in US Pacific where the players are.

  BackupRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: How long to keep an archive before S3 deletes it.

Conditions:
  # Everything to do with backups is skipped until an image exists to run.
  BackupsEnabled: !Not [!Equals [!Ref BackupImage, ""]]

Resources:

  # ---------------------------------------------------------------- logging

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}
      # Spring's default web logging is chatty. Seven days keeps this inside
      # the CloudWatch free tier instead of quietly billing per GB.
      RetentionInDays: 7

  # ------------------------------------------------------------------- iam

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        # Shell access without opening port 22.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: claim-elastic-ip-and-data-volume
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The instance attaches the EIP to itself at boot, so a replaced
              # instance comes back on the same address Atlas already trusts.
              - Effect: Allow
                Action: [ec2:AssociateAddress, ec2:DescribeAddresses]
                Resource: "*"
              # Same idea for the data volume: a replaced instance picks it back up.
              - Effect: Allow
                Action: [ec2:AttachVolume, ec2:DescribeVolumes]
                Resource: "*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameters]
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MongoUriParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TunnelTokenParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PostgresPasswordParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NakamaServerKeyParameter}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # -------------------------------------------------------------- security

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # EC2 rejects non-ASCII in this field, so keep it plain and short. The
      # reasoning lives in infra/ecs/README.md.
      GroupDescription: "No inbound rules; ingress arrives via Cloudflare Tunnel (outbound)"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: ECR, Atlas, Cloudflare edge, package mirrors.
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-no-ingress

  # ------------------------------------------------------------- compute

  # Atlas M0 has no PrivateLink, so the only way to reach it is an IP allow
  # list. An auto-assigned public IP changes whenever the ASG replaces the
  # instance, which would silently break the database connection. A public
  # IPv4 is billed either way, so pinning one costs nothing extra.
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-stable-egress

  # Nakama's Postgres used to live on the instance's root volume, which the auto
  # scaling group throws away whenever it replaces the instance — so the mechanism
  # meant to keep the service alive was also what destroyed its data. This volume
  # outlives the instance, and outlives the stack: losing accounts and leaderboards
  # to a `cloudformation delete` would be worse than leaving a volume behind.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref DataVolumeAvailabilityZone
      Size: !Ref DataVolumeSizeGb
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-data

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref EcsAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -x
            # The agent is held back until the data volume is mounted, further down.
            systemctl stop ecs || true
            echo "ECS_CLUSTER=${ProjectName}" >> /etc/ecs/ecs.config
            echo "ECS_ENABLE_CONTAINER_METADATA=true" >> /etc/ecs/ecs.config

            # Claim the stable address before anything tries to reach Atlas.
            TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)
            aws ec2 associate-address --region ${AWS::Region} \
              --instance-id "$IID" --allocation-id ${ElasticIp.AllocationId} \
              --allow-reassociation

            # 2 GiB of RAM with four containers leaves little slack. Swap is a
            # cushion against a GC spike killing the box, not a substitute for
            # sizing — containers still have hard memory caps.
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo "/swapfile none swap sw 0 0" >> /etc/fstab

            # Nakama's Postgres lives on a volume of its own so it survives both
            # task restarts and instance replacement. ECS is told to wait: a
            # container that started against an empty mount point would initialise
            # a fresh database on top of the real one.
            VOL=${DataVolume}
            aws ec2 attach-volume --region ${AWS::Region} \
              --volume-id "$VOL" --instance-id "$IID" --device /dev/sdf

            # Nitro exposes EBS as NVMe under a name that has nothing to do with
            # the one requested above; the by-id link is the reliable handle.
            DEV=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$(echo "$VOL" | tr -d '-')
            for _ in $(seq 1 60); do [ -e "$DEV" ] && break; sleep 2; done

            # A brand new volume has no filesystem. An existing one must never be
            # reformatted, so only make one when blkid finds nothing at all.
            if ! blkid "$DEV" >/dev/null 2>&1; then
              mkfs.ext4 -L hand-of-fate-data "$DEV"
            fi

            mkdir -p /var/lib/hand-of-fate
            echo "LABEL=hand-of-fate-data /var/lib/hand-of-fate ext4 defaults,nofail 0 2" >> /etc/fstab
            mount /var/lib/hand-of-fate

            # An instance that runs tasks without the volume would quietly start a
            # brand new Postgres on the root disk and look perfectly healthy while
            # doing it. Better to sit here doing nothing and be noticed.
            if ! mountpoint -q /var/lib/hand-of-fate; then
              echo "data volume is not mounted; not starting ECS" >&2
              exit 1
            fi

            mkdir -p /var/lib/hand-of-fate/postgres
            systemctl start ecs
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${ProjectName}-ecs

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref SubnetId]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      # Managed scaling would replace the instance under load; with MaxSize 1
      # this ASG exists for self-healing, not scaling.
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-ecs
          PropagateAtLaunch: true

  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          Status: DISABLED
        ManagedTerminationProtection: DISABLED

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName
      ClusterSettings:
        - Name: containerInsights
          Value: disabled          # Container Insights is billed per metric.

  ClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1

  # --------------------------------------------------------------- task

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ProjectName
      # host networking: containers reach each other on localhost and share the
      # instance's public IP for outbound. awsvpc would give the task its own
      # ENI with no public IP, breaking outbound unless a NAT gateway is added.
      NetworkMode: host
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: postgres-data
          Host: { SourcePath: /var/lib/hand-of-fate/postgres }
      ContainerDefinitions:

        - Name: postgres
          Image: postgres:16-alpine
          Essential: true
          MemoryReservation: 128
          Memory: 320
          Environment:
            - { Name: POSTGRES_DB, Value: nakama }
            - { Name: PGDATA, Value: /var/lib/postgresql/data/pgdata }
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PostgresPasswordParameter}
          # Defaults assume a far bigger machine. Nakama is the only client.
          Command:
            - postgres
            - -c
            - shared_buffers=64MB
            - -c
            - max_connections=20
            - -c
            - work_mem=4MB
          MountPoints:
            - SourceVolume: postgres-data
              ContainerPath: /var/lib/postgresql/data
          HealthCheck:
            Command: [CMD-SHELL, "pg_isready -U postgres -d nakama || exit 1"]
            Interval: 10
            Timeout: 5
            Retries: 10
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: postgres

        - Name: nakama
          Image: !Ref NakamaImage
          Essential: true
          MemoryReservation: 128
          Memory: 384
          DependsOn:
            - { ContainerName: postgres, Condition: HEALTHY }
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PostgresPasswordParameter}
            - Name: NAKAMA_SERVER_KEY
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NakamaServerKeyParameter}
          EntryPoint: [/bin/sh, -ecx]
          Command:
            - >
              /nakama/nakama migrate up
              --database.address postgres:$POSTGRES_PASSWORD@127.0.0.1:5432/nakama &&
              exec /nakama/nakama
              --name nakama1
              --database.address postgres:$POSTGRES_PASSWORD@127.0.0.1:5432/nakama
              --socket.server_key $NAKAMA_SERVER_KEY
              --logger.level INFO
              --session.token_expiry_sec 7200
          HealthCheck:
            Command: [CMD-SHELL, "/nakama/nakama healthcheck || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 10
            StartPeriod: 45
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nakama

        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          MemoryReservation: 384
          Memory: 768
          DependsOn:
            - { ContainerName: nakama, Condition: HEALTHY }
          Environment:
            - { Name: NAKAMA_HOST, Value: 127.0.0.1 }
            - { Name: NAKAMA_PORT, Value: "7349" }
            - { Name: CORS_ALLOWED_ORIGINS, Value: "https://handoffate.org,https://www.handoffate.org" }
            # Spring's web DEBUG default would dominate the CloudWatch bill.
            - { Name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB, Value: INFO }
            # Authentication. None of these are secret: Supabase signs with an
            # asymmetric key and publishes the public half, so the backend needs only
            # the address to fetch it from.
            - { Name: SUPABASE_JWKS_URI, Value: !Ref SupabaseJwksUri }
            - { Name: SUPABASE_JWT_ISSUER, Value: !Ref SupabaseJwtIssuer }
            - Name: ADMIN_SUPABASE_USER_IDS
              Value: !Join [",", !Ref AdminSupabaseUserIds]
          Secrets:
            - Name: MONGODB_URI
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MongoUriParameter}
            - Name: NAKAMA_SERVER_KEY
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NakamaServerKeyParameter}
          HealthCheck:
            Command: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 10
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

        - Name: cloudflared
          Image: cloudflare/cloudflared:latest
          Essential: true
          MemoryReservation: 32
          Memory: 96
          DependsOn:
            - { ContainerName: backend, Condition: HEALTHY }
          Command: [tunnel, --no-autoupdate, run]
          Secrets:
            - Name: TUNNEL_TOKEN
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TunnelTokenParameter}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cloudflared

  # ------------------------------------------------------------- backups

  # Atlas M0 has no backups and no way to turn them on, so the player data had no
  # recovery path at all. A dump lands here every night.
  BackupBucket:
    Type: AWS::S3::Bucket
    Condition: BackupsEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-backups-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-archives
            Status: Enabled
            Prefix: mongodb/
            ExpirationInDays: !Ref BackupRetentionDays
          - Id: drop-old-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 7
          - Id: abandon-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  BackupTaskRole:
    Type: AWS::IAM::Role
    Condition: BackupsEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Write and read back what it just wrote, to check the size. No
              # blanket delete: the only object it may remove is a partial archive
              # under the prefix it owns.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub ${BackupBucket.Arn}/mongodb/*

  BackupTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: BackupsEnabled
    Properties:
      Family: !Sub ${ProjectName}-backup
      NetworkMode: host
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt BackupTaskRole.Arn
      ContainerDefinitions:
        - Name: backup
          Image: !Ref BackupImage
          Essential: true
          # Runs beside the live stack on a 2 GiB box, so it gets what is spare.
          # The dump is streamed, never buffered to disk or held in memory.
          MemoryReservation: 64
          Memory: 200
          Environment:
            - { Name: BACKUP_BUCKET, Value: !Ref BackupBucket }
          Secrets:
            # The same connection string the backend uses. Read access to Atlas is
            # all a dump needs, and it is already granted to this instance's IP.
            - Name: MONGODB_URI
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MongoUriParameter}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backup

  BackupSchedulerRole:
    Type: AWS::IAM::Role
    Condition: BackupsEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-backup-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref BackupTaskDefinition
                Condition:
                  ArnEquals: { ecs:cluster: !GetAtt Cluster.Arn }
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt BackupTaskRole.Arn

  BackupScheduleRule:
    Type: AWS::Events::Rule
    Condition: BackupsEnabled
    Properties:
      Name: !Sub ${ProjectName}-backup
      Description: Nightly mongodump of Atlas into S3.
      ScheduleExpression: !Ref BackupSchedule
      State: ENABLED
      Targets:
        - Id: backup-task
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt BackupSchedulerRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref BackupTaskDefinition
            TaskCount: 1
            LaunchType: EC2

  Service:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviders
    Properties:
      ServiceName: !Ref ProjectName
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
      # One instance cannot host two copies of a host-network task, so the
      # rolling default would deadlock. This trades a short gap for progress.
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100

Outputs:
  EgressIp:
    Description: Add this to the Atlas IP access list. It survives instance replacement.
    Value: !Ref ElasticIp
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroupName:
    Value: !Ref LogGroup
  SecurityGroupId:
    Value: !GetAtt SecurityGroup.GroupId
