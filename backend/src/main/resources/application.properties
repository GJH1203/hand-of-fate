spring.application.name=card-game

# MongoDB Configuration
# Use environment variables for production
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/card_game}

# Authentication
# Supabase signs session tokens with an asymmetric key and publishes the public half,
# so nothing secret is needed here — only the project's JWKS endpoint. The service will
# not start without it, which is deliberate: a backend that cannot verify a token has no
# business answering requests.
security.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:}
security.jwt.issuer=${SUPABASE_JWT_ISSUER:}
# Supabase user ids allowed to reach /admin/**. Empty means nobody is.
security.admin.supabase-user-ids=${ADMIN_SUPABASE_USER_IDS:}

# Logging Configuration
logging.level.org.springframework.web=DEBUG

# Nakama Configuration
nakama.server.key=defaultkey
nakama.host=localhost
nakama.port=7349
nakama.ssl=false

# Actuator and Prometheus Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
